# ─────────────────────────────────────────────────────────────
#  WORKMANs shortcut map
#
#  Indentation makes a group, and the value holds the key. The name the code looks up is
#  those two joined with a dot --  gizmo: / translate: W  ->  "gizmo.translate"
#
#  Key names match the list in core/keyCode.h:
#      A-Z,  D0-D9 (digits),  F1-F25,  KP0-KP9 (numpad),
#      Space Tab Enter Escape Backspace Delete Insert Home End PageUp PageDown
#      Left Right Up Down,  LeftShift RightShift LeftControl LeftAlt ...
#  Mouse is MouseLeft / MouseMiddle / MouseRight.
#
#  Modifiers are joined with +:  Ctrl+N,  Ctrl+Shift+S,  Shift+P
#  Usable modifiers: Ctrl(=Control), Shift, Alt, Super(=Win)
#
#  WARNING: modifiers have to match *exactly* for a binding to fire. That is why P and
#     Shift+P do not swallow each other -- a partial match would let P take Shift+P first.
#
#  If this file is missing or its syntax is broken, the app starts with the built-in defaults
#  and logs a warning to the console. (One keymap typo must not stop the editor opening.)
# ─────────────────────────────────────────────────────────────

# Gizmo manipulation modes -- the same layout as Maya (Q release / W move / E rotate / R scale)
gizmo:
  none:       Q
  translate:  W
  rotate:     E
  scale:      R

file:
  newScene:     Ctrl+N
  openScene:    Ctrl+O
  saveAsScene:  Ctrl+Shift+S

app:
  exit:       Ctrl+Q

# Selection -- the Maya convention. The outliner and the viewport use the *same rules*.
#   A click with no modifier = replace (clears the existing selection), so it is not listed here.
#
# WARNING: Alt is deliberately unused -- camera.modifier below is LeftAlt, so
#    Alt+left-click is already tumble. Maya left Alt out of selection for the same reason.
select:
  toggle:     Shift+MouseLeft
  subtract:   Ctrl+MouseLeft
  add:        Ctrl+Shift+MouseLeft

# Hierarchy -- the Maya convention.
# Pick the children first, pick *the parent last*, then press parent.
hierarchy:
  parent:     P
  unparent:   Shift+P

edit:
  delete:     Delete

visibility:
  hide:       Ctrl+H
  show:       Shift+H

# Camera -- the Maya convention. Drag a mouse button while holding the modifier.
#   tumble = orbit / track = pan / dolly = move in and out
camera:
  modifier:   LeftAlt
  tumble:     MouseLeft
  track:      MouseMiddle
  dolly:      MouseRight
